name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
      JWT_EXPIRE_MINUTES: ${{ secrets.JWT_EXPIRE_MINUTES }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      APIS_PERU_TOKEN: ${{ secrets.APIS_PERU_TOKEN }}
      APIS_PERU_BASE_URL: ${{ secrets.APIS_PERU_BASE_URL }}
      OPEN_METEO_URL: ${{ secrets.OPEN_METEO_URL }}
      HUANCAYO_LAT: ${{ secrets.HUANCAYO_LAT }}
      HUANCAYO_LON: ${{ secrets.HUANCAYO_LON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Pruebas
        run: pytest tests/ -v
