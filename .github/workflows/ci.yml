name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # Valores dummy: los tests no necesitan secretos ni servicios reales.
      DATABASE_URL: postgresql://usuario:clave@localhost:5432/pruebas
      JWT_SECRET: test-secret-key-ci
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173
      APIS_PERU_TOKEN: dummy
      APIS_PERU_BASE_URL: https://api.example.test
      WEATHER_API_BASE_URL: https://api.weatherapi.com/v1
      WEATHER_API_KEY: dummy
      HUANCAYO_LAT: "-12.0651"
      HUANCAYO_LON: "-75.2049"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Pruebas
        run: pytest tests/ -v
